name: clothing-shop
services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: clothing
      POSTGRES_PASSWORD: local_dev_only
      POSTGRES_DB: clothing_local
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - clothing_pg:/var/lib/postgresql
      - ./apps/backend/prisma/local-init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clothing -d clothing_local"]
      interval: 5s
      timeout: 3s
      retries: 12
    mem_limit: 512m
volumes:
  clothing_pg:
