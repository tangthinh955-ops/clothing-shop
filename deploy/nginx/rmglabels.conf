server {
    listen 80;
    listen [::]:80;
    server_name rmglabels.duckdns.org;
    server_tokens off;
    access_log off;

    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/rmg-shop/acme;
        default_type text/plain;
    }

    location / {
        return 301 https://rmglabels.duckdns.org$request_uri;
    }
}

# HTTPS-BEGIN: remove this block only for the first ACME bootstrap.
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name rmglabels.duckdns.org;
    ssl_certificate /etc/letsencrypt/live/rmglabels.duckdns.org/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rmglabels.duckdns.org/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log off;
    client_max_body_size 6m;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Strict-Transport-Security "max-age=86400" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; object-src 'none'; base-uri 'self'; form-action 'self'; upgrade-insecure-requests" always;

    location = /api {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:4200;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    location / {
        proxy_pass http://127.0.0.1:4180;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
    }
}
# HTTPS-END
